<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>健身器械助手</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body data-tab="home">
<div id="phone">

  <!-- ===== 首页 Tab ===== -->
  <section class="page tab-page active" id="page-home">
    <header class="hd"><h1>健身器械助手</h1><span class="hd-note">首页 · 今日训练</span></header>
    <div id="home-reserve-area"></div>
    <div class="sec"><h2>今日训练</h2></div>
    <div id="home-plan-card"></div>
  </section>

  <!-- ===== 识别 Tab ===== -->
  <section class="page tab-page" id="page-identify">
    <header class="hd"><h1>识别</h1></header>
    <div class="viewfinder clickable" id="viewfinder" role="button" tabindex="0" aria-label="上传器械照片">
      <span class="vf-corner tl"></span><span class="vf-corner tr"></span>
      <span class="vf-corner bl"></span><span class="vf-corner br"></span>
      点击上传器械照片
      <input type="file" id="photo-input" accept="image/*" hidden/>
    </div>
    <p class="tip-line">上传清晰图有利于识别</p>
  </section>

  <!-- ===== 日志 Tab（M3） ===== -->
  <section class="page tab-page" id="page-log">
    <header class="hd"><h1>训练日志</h1></header>
    <div id="log-body"></div>
  </section>

  <!-- ===== 我的 Tab（M3，个人卡+四宫格入口，静态写死） ===== -->
  <section class="page tab-page" id="page-mine">
    <header class="hd"><h1>我的</h1></header>
    <div id="mine-body"></div>
  </section>

  <!-- ===== 拍照识别（二级页） ===== -->
  <section class="page sub-page" id="page-camera">
    <header class="hd">
      <button class="back" id="back-camera" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1>拍照识别</h1>
    </header>
    <div class="hint-bar">推荐直接从列表选择</div>

    <div class="viewfinder slim" id="cam-photo-area">
      <span class="vf-corner tl"></span><span class="vf-corner tr"></span>
      <span class="vf-corner bl"></span><span class="vf-corner br"></span>
      <span id="photo-holder" class="photo-holder">照片预览</span>
    </div>

    <div id="cam-result" class="hidden">
      <div class="sec"><h2>候选器械</h2><span class="note" id="sec-cand-note">相似度为示例值</span></div>
      <div id="cand-list"></div>

      <div class="card fall-card">
        <button class="fall-head" id="fall-toggle" type="button">
          都不是？<b>手动选择</b><span class="arrow" id="fall-arrow">▾</span>
        </button>
        <div id="fallback-body">
          <div class="fall-search">
            <input id="search-input" type="search" placeholder="搜索器械名称" autocomplete="off"/>
          </div>
          <div id="fallback-list"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 今日方案（二级页，M2） ===== -->
  <section class="page sub-page" id="page-plan">
    <header class="hd">
      <button class="back" id="back-plan" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1>今日方案</h1>
    </header>

    <div class="card">
      <div class="sec-in"><h2>选择训练部位</h2><span class="note">单选</span></div>
      <div id="part-grid" class="part-grid"></div>
      <div class="picked-line">已选择：<b id="picked-part">胸</b></div>
    </div>

    <button class="coach-line" id="link-reserve" type="button">科学训练请找教练</button>

    <div class="bottom-bar">
      <button class="btn-primary" id="btn-gen" type="button">生成今日方案</button>
    </div>
  </section>

  <!-- ===== 方案执行（二级页，M2） ===== -->
  <section class="page sub-page" id="page-exec">
    <header class="hd">
      <button class="back" id="back-exec" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1>方案执行</h1>
    </header>

    <div class="card">
      <div class="sec-in"><h2>当训训练清单</h2></div>
      <div class="plan-sub" id="exec-sub"></div>
      <div id="exec-list"></div>
    </div>

    <div class="exec-bar">
      <button class="btn-secondary" id="btn-repick" type="button">重新选择</button>
      <button class="btn-primary" id="btn-finish" type="button">完成训练</button>
    </div>
  </section>

  <!-- ===== 预约留资（二级页，M3） ===== -->
  <section class="page sub-page" id="page-reserve">
    <header class="hd">
      <button class="back" id="back-reserve" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1>预约体验</h1>
    </header>

    <div class="card">
      <div class="sec-in"><h2>选择教练</h2><span class="note">单选</span></div>
      <p class="reserve-tip">请选择一位教练，预约训练体验。</p>
      <div class="resv-cards" id="coach-list"></div>
      <div class="picked-line">已选择：<b id="picked-coach">未选择</b></div>
    </div>

    <div class="bottom-bar">
      <button class="btn-primary" id="btn-submit-resv" type="button" disabled>提交预约</button>
    </div>
  </section>

  <!-- ===== 器械详情（二级页，置于所有二级页之后：可从相机/方案/执行页叠入不被遮挡） ===== -->
  <section class="page sub-page" id="page-detail">
    <header class="hd">
      <button class="back" id="back-detail" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <h1>器械详情页</h1>
    </header>
    <div id="detail-body"></div>
  </section>

  <!-- 相机悬浮按钮（识别 Tab 唯一入口，56×56） -->
  <button class="fab-cam" id="fab-cam" aria-label="拍照识别">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H9l1.4-2h3.2L15 7h3.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/>
      <circle cx="12" cy="13" r="3.2"/>
    </svg>
  </button>

  <!-- ===== 底部导航：首页 / 识别 / 日志 / 我的 ===== -->
  <nav id="tabbar">
    <button class="tab active" data-tab="home" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <g class="st" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20h5v-5.5h3V20h5V9.5"/></g>
          <g class="fl" fill="currentColor"><path d="M12 2.8 3 10.6V20h6.4v-5.5h5.2V20H21v-9.4z"/></g>
        </svg>
      </span>
      <span class="lb">首页</span>
    </button>
    <button class="tab" data-tab="identify" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <g class="st" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/><path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3"/></g>
          <g class="fl" fill="currentColor"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="4"/></g>
        </svg>
      </span>
      <span class="lb">识别</span>
    </button>
    <button class="tab" data-tab="log" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <g class="st" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></g>
          <g class="fl"><path fill="currentColor" d="M6.5 3.5h11A1.5 1.5 0 0 1 19 5v14a1.5 1.5 0 0 1-1.5 1.5h-11z"/><path d="M9 8h6M9 12h6M9 16h4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g>
        </svg>
      </span>
      <span class="lb">日志</span>
    </button>
    <button class="tab" data-tab="mine" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <g class="st" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></g>
          <g class="fl" fill="currentColor"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.6 20c.9-3.9 3.9-6 7.4-6s6.5 2.1 7.4 6z"/></g>
        </svg>
      </span>
      <span class="lb">我的</span>
    </button>
  </nav>

  <!-- 完成弹层（M2，每日一次） -->
  <div id="done-modal" class="modal hidden">
    <div class="modal-mask" id="modal-mask"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="celebrate">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5H4.5a0 0 0 0 0 0 0c0 2.5 1 4.2 2.5 4.8M17 5h2.5c0 2.5-1 4.2-2.5 4.8"/><path d="M12 13v3M8.5 20h7M10 20c0-2 0.8-3 2-3s2 1 2 3"/>
        </svg>
      </div>
      <h2 class="modal-title">今日训练完成！</h2>
      <p class="modal-sub" id="modal-stats">本次共完成 0 组 · 训练时长 0 分钟</p>
      <button class="btn-primary modal-btn" id="btn-coach" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><circle cx="12" cy="7.5" r="3.2"/><path d="M5 19.5c.8-3.4 3.6-5.3 7-5.3s6.2 1.9 7 5.3z"/></svg>
        教练带练更科学
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden"><span class="spinner"></span><span id="toast-text">识别中…</span></div>
</div>

<script src="js/data.js"></script>
<script src="js/config.local.js"></script>
<script src="js/baidu-ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
